<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 电脑：大长方形屏幕 + 一根线条支架（无猫耳） -->
    <g id="computer">
      <!-- 屏幕 -->
      <rect x="-20" y="-22" width="40" height="28" rx="2" fill="#fff" stroke="#000" stroke-width="2.2" />
      <!-- 支架：一根线条 -->
      <line x1="0" y1="6" x2="0" y2="16" stroke="#000" stroke-width="2.2" />
      <line x1="-9" y1="16" x2="9" y2="16" stroke="#000" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </defs>

  <!-- 分叉连接线 -->
  <g stroke="#000" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- 主干 -->
    <line x1="100" y1="66" x2="100" y2="92" />
    <!-- 横线 -->
    <line x1="56" y1="92" x2="144" y2="92" />
    <!-- 两路分叉向下 -->
    <line x1="56" y1="92" x2="56" y2="118" />
    <line x1="144" y1="92" x2="144" y2="118" />
  </g>

  <!-- 服务器：竖长形 -->
  <g transform="translate(100,44)">
    <rect x="-16" y="-22" width="32" height="44" rx="3" fill="#fff" stroke="#000" stroke-width="2.2" />
    <!-- 三条横线 -->
    <line x1="-9" y1="-12" x2="9" y2="-12" stroke="#000" stroke-width="2" stroke-linecap="round" />
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#000" stroke-width="2" stroke-linecap="round" />
    <line x1="-9" y1="12" x2="9" y2="12" stroke="#000" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 两台电脑 -->
  <use href="#computer" transform="translate(56,140) scale(0.9)" />
  <use href="#computer" transform="translate(144,140) scale(0.9)" />
</svg>
